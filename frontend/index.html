<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">
    <title>CJH FREE VPS | Chachaji Hosting</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <div class="logo">C</div>
            <div>
                <h2>CJH FREE VPS</h2>
                <small>CHACHAJI HOSTING</small>
            </div>
        </div>
        <span class="status">● PANEL</span>
    </header>

    <main class="container">

        <!-- Login / Register -->
        <section id="auth-section" class="card">
            <h1 id="auth-title">Welcome Back</h1>
            <p class="muted">Sign in to your CJH account.</p>

            <form id="auth-form">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    minlength="3"
                    maxlength="32"
                    autocomplete="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="10"
                    maxlength="128"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    required
                >

                <div id="register-fields" hidden>
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        minlength="10"
                        maxlength="128"
                        autocomplete="new-password"
                        placeholder="Confirm password"
                    >
                </div>

                <button id="auth-button" type="submit">
                    Login
                </button>
            </form>

            <p id="auth-message" class="message" role="status" aria-live="polite"></p>

            <p class="switch">
                <span id="switch-text">Don't have an account?</span>
                <button
                    class="text-button"
                    type="button"
                    id="switch-button"
                    onclick="toggleAuth()"
                >Register</button>
            </p>
        </section>

        <!-- User Dashboard -->
        <section id="dashboard" hidden>
            <div class="welcome">
                <div>
                    <p class="muted">YOUR DASHBOARD</p>
                    <h1>My VPS</h1>
                    <p id="welcome-user"></p>
                </div>

                <button
                    id="logout-button"
                    class="secondary"
                    type="button"
                    onclick="logout()"
                >Logout</button>
            </div>

            <!-- VPS Creation -->
            <div id="empty-state" class="card">
                <div class="server-icon">▣</div>
                <h2>No VPS yet</h2>
                <p class="muted">
                    Select an environment to submit a VPS request.
                </p>

                <label for="provider">Environment Type</label>
                <select id="provider" name="provider">
                    <option value="docker">Docker Environment</option>
                    <option value="kvm">KVM Virtual Machine</option>
                    <option value="sshx">SSHX Terminal</option>
                </select>

                <button
                    id="create-vps-button"
                    type="button"
                    onclick="createVPS()"
                >CREATE VPS</button>

                <p
                    id="vps-message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></p>
            </div>

            <!-- Existing VPS instances -->
            <div id="vps-list"></div>

            <p class="footer">CJH FREE VPS · Chachaji Hosting</p>
        </section>

    </main>

    <script src="/static/app.js"></script>
</body>
                                        </html>
